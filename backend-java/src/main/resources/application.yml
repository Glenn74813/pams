spring:
  application:
    name: pams-backend
  config:
    # Local secrets (DB password, JWT secret) live in backend-java/.env, which is gitignored.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Timestamps are stored as Asia/Manila wall-clock time (inherited from the Laravel app).
        jdbc.time_zone: Asia/Manila
  flyway:
    # One folder per database: postgresql/ (V1..) and sqlserver/ (a V18 baseline of the same schema).
    locations: classpath:db/migration/{vendor}
    # The existing database was built by Laravel; V1 is a snapshot of that schema and is only
    # executed on an empty database. Every schema change from now on is a Flyway migration.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8095}
  error:
    include-stacktrace: never
    include-message: never

pams:
  timezone: Asia/Manila
  # Where the React app is served; QR codes on labels point here.
  app-url: ${PAMS_APP_URL:http://localhost:5190}
  storage:
    public-dir: ${PAMS_STORAGE_DIR:storage/public}
  jwt:
    secret: ${PAMS_JWT_SECRET}
    ttl-minutes: 60
  security:
    max-login-attempts: 5
    lockout-minutes: 15
    login-requests-per-minute: 5
  # Single sign-on through an OpenID Connect identity provider (TOR 1.3.1), e.g. Microsoft Entra ID,
  # Google Workspace or Keycloak. Off unless an issuer and client are configured. People sign in with
  # the provider; their PAMS account is matched by email and must already exist and be active.
  sso:
    issuer: ${PAMS_SSO_ISSUER:}
    client-id: ${PAMS_SSO_CLIENT_ID:}
    client-secret: ${PAMS_SSO_CLIENT_SECRET:}
    # The provider sends people back here; register it with the provider. Defaults to {app-url}/api/auth/sso/callback.
    redirect-uri: ${PAMS_SSO_REDIRECT_URI:}
    button-label: ${PAMS_SSO_BUTTON_LABEL:Sign in with single sign-on}
    scopes: ${PAMS_SSO_SCOPES:openid email profile}
  # Digital signing (TOR 1.4.11): an external signing platform (e.g. one using PNPKI certificates) is
  # told about each new signing request and posts the signature back with this key.
  signing:
    platform-url: ${PAMS_SIGNING_PLATFORM_URL:}
    platform-key: ${PAMS_SIGNING_PLATFORM_KEY:}
